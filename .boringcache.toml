workspace = "boringcache/benchmark-grpc"

[adapters.bazel]
tag = "grpc-bazel-local"
no-platform = true
no-git = true
metadata-hints = ["benchmark=grpc", "workload=csm-client-server"]
# Apply the same output, transfer, and toolchain policy after provider flags.
command = [
  "./tools/bazel",
  "build",
  "--config=opt",
  "--remote_download_outputs=toplevel",
  "--remote_cache_async=false",
  "--remote_max_connections=64",
  "--remote_timeout=10m",
  "--incompatible_strict_action_env",
  "--action_env=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "--host_action_env=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "--repo_env=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "--repo_env=CC=/usr/bin/gcc",
  "--repo_env=CXX=/usr/bin/g++",
  "--repo_env=LD=/usr/bin/ld",
  "//examples/cpp/csm:csm_greeter_client",
  "//examples/cpp/csm:csm_greeter_server",
]

# Bazel remote-cache benchmark. The measured BoringCache surface is
# boringcache/one mode=bazel configuring Bazel's --remote_cache through
# the proxy. Do not archive Bazel's output root or local disk cache here;
# those local caches can mask remote-cache misses and belong in a separate
# archive-parity lane if we need that comparison later.
