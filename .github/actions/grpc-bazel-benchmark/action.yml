name: "Run gRPC Bazel benchmark phase"
description: "Runs one gRPC Bazel cache provider and phase."
inputs:
  strategy: {required: true}
  cache_lane: {required: true}
  phase: {required: true}
  benchmark_id: {required: true}
  cli_version: {required: false, default: ""}
runs:
  using: composite
  steps:
    - name: Checkout pinned gRPC source
      shell: bash
      run: |
        git submodule sync --recursive
        git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
    - name: Prepare clean gRPC source
      shell: bash
      env:
        PREPARE_PHASE: ${{ inputs.phase == 'warm' && 'warm1' || 'base' }}
      run: ./scripts/prepare-source.sh "$PREPARE_PHASE"
    - name: Select the cache cohort
      id: scope
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        CACHE_LANE: ${{ inputs.cache_lane }}
      run: |
        set -euo pipefail
        ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        ref_slug="${ref_slug#-}"
        ref_slug="${ref_slug%-}"
        ref_slug="${ref_slug:-main}"
        if [[ "$CACHE_LANE" == "rolling" ]]; then
          cohort="${BENCHMARK_ID}-rolling-${ref_slug}"
          gha_prefix="ac-${cohort}-"
          gha_key="${gha_prefix}r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          buildbuddy_instance="${BENCHMARK_ID}/rolling/${ref_slug}"
        else
          cohort="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          gha_prefix="ac-${cohort}-"
          gha_key="${gha_prefix}cold"
          buildbuddy_instance="${BENCHMARK_ID}/run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        fi
        ./scripts/scope-boringcache-run.sh "$cohort"
        {
          echo "cohort=${cohort}"
          echo "gha_prefix=${gha_prefix}"
          echo "gha_key=${gha_key}"
          echo "buildbuddy_instance=${buildbuddy_instance}"
        } >> "$GITHUB_OUTPUT"
    - name: Restore the GitHub Actions cache
      if: inputs.strategy == 'actions-cache'
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.BAZEL_DISK_CACHE }}
        key: ${{ steps.scope.outputs.gha_key }}
        restore-keys: ${{ inputs.cache_lane == 'rolling' && steps.scope.outputs.gha_prefix || '' }}
        fail-on-cache-miss: ${{ inputs.phase == 'warm' }}
    - name: Configure BoringCache publish
      if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
      uses: boringcache/one@366e1aa37c271014d69aa6e1a12df57c472fdf5d # v1.16.9
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: bazel
        trust-policy: publish
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'fresh-cold' }}
    - name: Configure BoringCache restore
      if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
      uses: boringcache/one@366e1aa37c271014d69aa6e1a12df57c472fdf5d # v1.16.9
      with:
        cli-version: ${{ inputs.cli_version }}
        setup: none
        mode: bazel
        trust-policy: restore
        fail-on-cache-miss: true
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=fresh-warm
    - name: Build the gRPC target
      shell: bash
      env:
        BAZEL_CACHE_STRATEGY: ${{ inputs.strategy }}
        BUILDBUDDY_REMOTE_INSTANCE_NAME: ${{ steps.scope.outputs.buildbuddy_instance }}
        BUILDBUDDY_REMOTE_UPLOAD_LOCAL_RESULTS: ${{ inputs.phase == 'warm' && 'false' || 'true' }}
      run: ./scripts/run-grpc-bazel-build.sh
    - name: Save the GitHub Actions cache
      if: inputs.strategy == 'actions-cache' && inputs.phase == 'publish'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.BAZEL_DISK_CACHE }}
        key: ${{ steps.scope.outputs.gha_key }}
