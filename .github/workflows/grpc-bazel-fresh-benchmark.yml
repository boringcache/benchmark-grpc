name: "gRPC Bazel Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 3 * * 5"

permissions:
  contents: read
  actions: write

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GHA
            strategy: actions-cache
          - name: BuildBuddy
            strategy: buildbuddy
          - name: BC
            strategy: boringcache
    uses: ./.github/workflows/reusable-grpc-bazel-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: fresh
      benchmark_id: ${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit
