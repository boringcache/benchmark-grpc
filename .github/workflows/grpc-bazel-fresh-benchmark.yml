name: "gRPC Bazel Fresh"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for isolated comparison runs.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  schedule: [{cron: "0 3 * * 5"}]
  pull_request:
    paths: [".boringcache.toml", ".gitmodules", ".github/actions/grpc-bazel-benchmark/**", ".github/workflows/grpc-bazel-benchmark.yml", ".github/workflows/grpc-bazel-fresh-benchmark.yml", "scripts/**", "upstream"]
permissions: {contents: read, actions: write}
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  BAZEL_OUTPUT_USER_ROOT: /tmp/boringcache-grpc-bazel/output-root
  BAZEL_OUTPUT_BASE: /tmp/boringcache-grpc-bazel/output-base
  BAZEL_DISK_CACHE: /tmp/boringcache-grpc-bazel/disk-cache
  BAZEL_TARGET: "//examples/cpp/csm:csm_greeter_client"
  BENCHMARK_ID: ${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}
jobs:
  cold:
    name: ${{ matrix.provider }} gRPC Bazel cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 300
    strategy: &provider_strategy
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache}
          - {provider: BuildBuddy, strategy: buildbuddy}
          - {provider: BoringCache, strategy: boringcache}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/grpc-bazel-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: fresh, phase: publish, benchmark_id: "${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}", cli_version: "${{ inputs.cli_version }}"}
  warm:
    name: ${{ matrix.provider }} gRPC Bazel warm
    needs: cold
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 300
    strategy: *provider_strategy
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/grpc-bazel-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: fresh, phase: warm, benchmark_id: "${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}", cli_version: "${{ inputs.cli_version }}"}
  report:
    name: gRPC Bazel fresh report
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-${{ env.BENCHMARK_ID }}-*
          path: phase-evidence
      - name: Publish the gRPC Bazel benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "gRPC Bazel fresh benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the BoringCache fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-boringcache-fresh
          path: benchmark-results/${{ env.BENCHMARK_ID }}-boringcache-fresh.json
          if-no-files-found: error
      - name: Retain the GitHub Actions fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-actions-cache-fresh
          path: benchmark-results/${{ env.BENCHMARK_ID }}-actions-cache-fresh.json
          if-no-files-found: error
      - name: Retain the BuildBuddy fresh result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-buildbuddy-fresh
          path: benchmark-results/${{ env.BENCHMARK_ID }}-buildbuddy-fresh.json
          if-no-files-found: error
