name: "gRPC Bazel - Depot"
run-name: ${{ inputs.cache_lane == 'rolling' && 'Depot Rolling' || 'Depot Fresh' }}

on:
  workflow_call:
    inputs:
      cache_lane:
        required: false
        type: string
        default: fresh

concurrency:
  group: grpc-bazel-depot-cache-${{ github.ref_name }}-${{ inputs.cache_lane || 'fresh' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PROJECT_REPO: grpc/grpc
  BENCHMARK_ID: grpc-bazel
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  BAZEL_TARGET: "//examples/cpp/csm:csm_greeter_client"
  BAZEL_OUTPUT_BASE: /tmp/boringcache-bazel-root/output-base

jobs:
  seed-cache:
    name: ${{ inputs.cache_lane == 'rolling' && 'Commit' || 'Cold' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAZEL_OUTPUT_USER_ROOT: /tmp/boringcache-bazel-root
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
      DEPOT_ORG_ID: ${{ secrets.DEPOT_ORG_ID || vars.DEPOT_ORG_ID || '' }}
    outputs:
      cold_seconds: ${{ steps.cold_baseline_build.outputs.seconds }}
      cold_build_seconds: ${{ steps.cold_baseline_build.outputs.build_seconds }}
      scope_started_at: ${{ steps.scope.outputs.scope_started_at }}
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
      action_scope: ${{ steps.scope.outputs.action_scope }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned upstream submodule shallowly
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare base benchmark source tree
        run: ./scripts/prepare-source.sh base

      - name: Start build timing
        id: seed_timing_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate Depot token
        run: |
          set -euo pipefail
          [[ -n "${DEPOT_TOKEN}" ]] || { echo "Missing Depot token" >&2; exit 1; }

      - name: Prepare benchmark scope
        id: scope
        run: |
          set -euo pipefail
          ref_slug="$(printf '%s' "${GITHUB_REF_NAME:-main}" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          if [[ "${{ inputs.cache_lane || 'fresh' }}" == "rolling" ]]; then
            cache_scope="${BENCHMARK_ID}/depot-cache/rolling/${ref_slug}"
            action_scope=""
          else
            cache_scope="${BENCHMARK_ID}/depot-cache/run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
            action_scope="${cache_scope}"
          fi
          scope_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "scope_started_at=${scope_started_at}" >> "$GITHUB_OUTPUT"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
          echo "action_scope=${action_scope}" >> "$GITHUB_OUTPUT"

          cat > ./run-grpc-bazel-build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          bazel_output_root="${BAZEL_OUTPUT_USER_ROOT:?BAZEL_OUTPUT_USER_ROOT must be set}"
          bazel_output_base="${BAZEL_OUTPUT_BASE:?BAZEL_OUTPUT_BASE must be set}"
          depot_token="${DEPOT_TOKEN:?DEPOT_TOKEN must be set}"
          depot_action_scope="${DEPOT_BAZEL_ACTION_SCOPE:-}"
          depot_args=(
            "--remote_cache=https://cache.depot.dev"
            "--remote_timeout=10m"
            "--remote_header=authorization=${depot_token}"
          )
          if [[ -n "${DEPOT_ORG_ID:-}" ]]; then
            depot_args+=("--remote_header=x-depot-org=${DEPOT_ORG_ID}")
          fi
          if [[ -n "${depot_action_scope}" ]]; then
            depot_args+=("--action_env=DEPOT_BENCHMARK_CACHE_SCOPE=${depot_action_scope}")
          fi
          if [[ "${DEPOT_REMOTE_UPLOAD_LOCAL_RESULTS:-true}" == "false" ]]; then
            depot_args+=("--remote_upload_local_results=false")
          fi

          max_attempts=3
          attempt=1
          while true; do
            if (cd upstream && ./tools/bazel --output_user_root="$bazel_output_root" --output_base="$bazel_output_base" build "${depot_args[@]}" "$BAZEL_TARGET"); then
              break
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Bazel build failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            echo "Bazel build failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
            attempt=$((attempt + 1))
            sleep 5
          done
          SH
          chmod +x ./run-grpc-bazel-build.sh

      - name: ${{ inputs.cache_lane == 'rolling' && 'Run rolling commit build' || 'Run fresh cold build' }}
        id: cold_baseline_build
        env:
          DEPOT_BAZEL_ACTION_SCOPE: ${{ steps.scope.outputs.action_scope }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.cache_lane || 'fresh' }}" != "rolling" ]]; then
            rm -rf "$BAZEL_OUTPUT_USER_ROOT"
          fi

          phase_start="${{ steps.seed_timing_start.outputs.started_at }}"
          start="$(date +%s)"
          ./run-grpc-bazel-build.sh
          end="$(date +%s)"
          echo "seconds=$((end - phase_start))" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$((end - start))" >> "$GITHUB_OUTPUT"


  scenario-builds:
    name: Warm
    needs: seed-cache
    if: ${{ inputs.cache_lane != 'rolling' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAZEL_OUTPUT_USER_ROOT: /tmp/boringcache-bazel-root
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
      DEPOT_ORG_ID: ${{ secrets.DEPOT_ORG_ID || vars.DEPOT_ORG_ID || '' }}
      DEPOT_BAZEL_ACTION_SCOPE: ${{ needs.seed-cache.outputs.action_scope }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned upstream submodule shallowly
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare scenario source tree
        run: ./scripts/prepare-source.sh warm1

      - name: Validate Depot token
        run: |
          set -euo pipefail
          [[ -n "${DEPOT_TOKEN}" ]] || { echo "Missing Depot token" >&2; exit 1; }

      - name: Prepare benchmark scope
        id: scope
        run: |
          set -euo pipefail
          scope_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "scope_started_at=${scope_started_at}" >> "$GITHUB_OUTPUT"

          cat > ./run-grpc-bazel-build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          bazel_output_root="${BAZEL_OUTPUT_USER_ROOT:?BAZEL_OUTPUT_USER_ROOT must be set}"
          bazel_output_base="${BAZEL_OUTPUT_BASE:?BAZEL_OUTPUT_BASE must be set}"
          depot_token="${DEPOT_TOKEN:?DEPOT_TOKEN must be set}"
          depot_action_scope="${DEPOT_BAZEL_ACTION_SCOPE:-}"
          depot_args=(
            "--remote_cache=https://cache.depot.dev"
            "--remote_timeout=10m"
            "--remote_header=authorization=${depot_token}"
          )
          if [[ -n "${DEPOT_ORG_ID:-}" ]]; then
            depot_args+=("--remote_header=x-depot-org=${DEPOT_ORG_ID}")
          fi
          if [[ -n "${depot_action_scope}" ]]; then
            depot_args+=("--action_env=DEPOT_BENCHMARK_CACHE_SCOPE=${depot_action_scope}")
          fi
          if [[ "${DEPOT_REMOTE_UPLOAD_LOCAL_RESULTS:-true}" == "false" ]]; then
            depot_args+=("--remote_upload_local_results=false")
          fi

          max_attempts=3
          attempt=1
          while true; do
            if (cd upstream && ./tools/bazel --output_user_root="$bazel_output_root" --output_base="$bazel_output_base" build "${depot_args[@]}" "$BAZEL_TARGET"); then
              break
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Bazel build failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            echo "Bazel build failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
            attempt=$((attempt + 1))
            sleep 5
          done
          SH
          chmod +x ./run-grpc-bazel-build.sh

      - name: Start scenario timing
        id: scenario_timing_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Clean Bazel for warm build
        run: rm -rf "$BAZEL_OUTPUT_USER_ROOT"

      - name: Run warm build
        id: warm1_build
        env:
          DEPOT_REMOTE_UPLOAD_LOCAL_RESULTS: "false"
        run: |
          set -euo pipefail
          phase_start="${{ steps.scenario_timing_start.outputs.started_at }}"
          start="$(date +%s)"
          ./run-grpc-bazel-build.sh
          end="$(date +%s)"
          echo "seconds=$((end - phase_start))" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$((end - start))" >> "$GITHUB_OUTPUT"


      - name: Capture scenario timing
        id: phase_timing
        run: |
          set -euo pipefail
          seconds=""
          build_seconds=""
          seconds="${{ steps.warm1_build.outputs.seconds }}"
          build_seconds="${{ steps.warm1_build.outputs.build_seconds }}"
          if [[ -z "${seconds}" ]]; then
            echo "No timing captured for warm" >&2
            exit 1
          fi
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          echo "build_seconds=${build_seconds}" >> "$GITHUB_OUTPUT"
      - name: Persist scenario timing artifact
        run: |
          set -euo pipefail
          mkdir -p benchmark-phase
          cat > "benchmark-phase/warm1.env" <<EOF
          phase=warm1
          seconds=${{ steps.phase_timing.outputs.seconds }}
          build_seconds=${{ steps.phase_timing.outputs.build_seconds }}
          EOF
      - name: Upload scenario timing artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-phase-${{ env.BENCHMARK_ID }}-depot-cache-warm
          path: benchmark-phase/warm1.env
          if-no-files-found: error

  finalize-benchmark:
    name: Report
    needs: [seed-cache, scenario-builds]
    if: ${{ always() && needs.seed-cache.result == 'success' && (needs.scenario-builds.result == 'success' || needs.scenario-builds.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Download scenario timing artifacts
        if: ${{ inputs.cache_lane != 'rolling' }}
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-phase-${{ env.BENCHMARK_ID }}-depot-cache-*
          path: benchmark-phase
          merge-multiple: true
      - name: Collect scenario timings
        if: ${{ inputs.cache_lane != 'rolling' }}
        id: timings
        run: |
          set -euo pipefail
          parse_phase() {
            local phase="$1"
            local key="${phase//-/_}"
            local file="benchmark-phase/${phase}.env"
            if [[ ! -f "$file" ]]; then
              echo "Missing timing artifact for phase ${phase}" >&2
              ls -R benchmark-phase || true
              exit 1
            fi
            local seconds
            seconds="$(grep "^seconds=" "$file" | head -n1 | cut -d= -f2-)"
            if [[ -z "${seconds}" ]]; then
              echo "Timing artifact for phase ${phase} has empty seconds" >&2
              cat "$file" >&2
              exit 1
            fi
            echo "${key}_seconds=${seconds}" >> "$GITHUB_OUTPUT"
            local build_seconds
            build_seconds="$(grep "^build_seconds=" "$file" | head -n1 | cut -d= -f2- || true)"
            if [[ -n "${build_seconds}" ]]; then
              echo "${key}_build_seconds=${build_seconds}" >> "$GITHUB_OUTPUT"
            fi
          }
          parse_phase warm1

      - name: Capture committed upstream ref
        id: upstream_ref
        run: echo "sha=$(git rev-parse HEAD:upstream)" >> "$GITHUB_OUTPUT"

      - name: Write benchmark artifacts
        id: artifact_files
        run: |
          ./scripts/write-benchmark-artifacts.sh \
            --benchmark "$BENCHMARK_ID" \
            --strategy "depot-cache" \
            --lane "${{ inputs.cache_lane || 'fresh' }}" \
            --project-repo "$PROJECT_REPO" \
            --project-ref "${{ steps.upstream_ref.outputs.sha }}" \
            --cold-seconds "${{ needs.seed-cache.outputs.cold_seconds }}" \
            --cold-build-seconds "${{ needs.seed-cache.outputs.cold_build_seconds }}" \
            --warm1-seconds "${{ inputs.cache_lane == 'rolling' && '' || steps.timings.outputs.warm1_seconds }}" \
            --warm1-build-seconds "${{ inputs.cache_lane == 'rolling' && '' || steps.timings.outputs.warm1_build_seconds }}" \
            --cache-storage-bytes "0" \
            --cache-storage-source "depot-cache-ui" \
            --cache-storage-note "Depot remote Bazel cache storage is visible in the Depot Cache UI, not the GitHub Actions cache API." \
            --mode bazel \
            --adapter bazel \
            --api-url "https://cache.depot.dev" \
            --hit-behavior-note "${{ inputs.cache_lane == 'rolling' && format('Rolling lane: this run builds the current upstream commit as-is against the existing Depot remote Bazel cache for this organization and records that commit build only; warm follow-up runs are intentionally skipped. Local benchmark scope label: {0}.', needs.seed-cache.outputs.cache_scope) || format('Fresh lane: both phases start from empty local Bazel output roots and use Depot Cache through Bazel remote_cache=https://cache.depot.dev. Because Depot Cache does not expose a documented Bazel purge/namespace knob, this fresh lane scopes Bazel action keys with DEPOT_BENCHMARK_CACHE_SCOPE={0}; Warm rebuilds the same pinned source tree on a fresh runner against the Depot remote cache populated by the cold build, with local-result uploads disabled during warm verification.', needs.seed-cache.outputs.action_scope) }}"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-depot-cache-${{ inputs.cache_lane || 'fresh' }}
          path: |
            ${{ steps.artifact_files.outputs.json_path }}
            ${{ steps.artifact_files.outputs.md_path }}
          if-no-files-found: error

      - name: Publish summary
        run: cat "${{ steps.artifact_files.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
