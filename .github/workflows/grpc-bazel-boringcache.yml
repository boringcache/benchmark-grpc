name: "gRPC Bazel - BC"
run-name: ${{ inputs.cache_lane == 'rolling' && 'BC Rolling' || 'BC Fresh' }}

on:
  workflow_call:
    inputs:
      cache_lane:
        required: false
        type: string
        default: fresh
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
concurrency:
  group: grpc-bazel-boringcache-${{ github.ref_name }}-${{ inputs.cache_lane || 'fresh' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PROJECT_REPO: grpc/grpc
  BENCHMARK_ID: grpc-bazel
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  BAZEL_TARGET: "//examples/cpp/csm:csm_greeter_client"
  BAZEL_OUTPUT_BASE: /tmp/boringcache-bazel-root/output-base
  
jobs:
  prepare-benchmark:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      bazel_remote_cache_tag: ${{ steps.cache_tags.outputs.bazel_remote_cache_tag }}
    steps:
      - name: Resolve benchmark cache tags
        id: cache_tags
        run: |
          set -euo pipefail
          lane="${{ inputs.cache_lane || 'fresh' }}"
          if [[ "$lane" == "rolling" ]]; then
            # Keep branch-dispatch rolling tags server-valid; github.ref_name can contain '/'.
            ref_slug="$(printf '%s' "${GITHUB_REF_NAME:-main}" | tr -c 'A-Za-z0-9._-' '-')"
            ref_slug="${ref_slug#-}"
            ref_slug="${ref_slug%-}"
            ref_slug="${ref_slug:-main}"
            bazel_remote_cache_tag="grpc-bazel-remote-cache-rolling-${ref_slug}"
          else
            bazel_remote_cache_tag="grpc-bazel-remote-cache-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          echo "bazel_remote_cache_tag=${bazel_remote_cache_tag}" >> "$GITHUB_OUTPUT"

  seed-cache:
    name: ${{ inputs.cache_lane == 'rolling' && 'Commit' || 'Cold' }}
    needs: prepare-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAZEL_OUTPUT_USER_ROOT: /tmp/boringcache-bazel-root
      BAZEL_REMOTE_CACHE_TAG: ${{ needs.prepare-benchmark.outputs.bazel_remote_cache_tag }}
      BORINGCACHE_PROXY_METADATA_HINTS: benchmark=grpc-bazel,phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}
    outputs:
      tags_csv: ${{ steps.resolved_seed_tag.outputs.tags_csv }}
      cold_seconds: ${{ steps.cold_baseline_build.outputs.seconds }}
      cold_build_seconds: ${{ steps.cold_baseline_build.outputs.build_seconds }}
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned upstream submodule shallowly
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare base benchmark source tree
        run: ./scripts/prepare-source.sh base

      - name: Start build timing
        id: seed_timing_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare benchmark helpers
        id: scope
        run: |
          set -euo pipefail

          scope_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tag_bazel="${BAZEL_REMOTE_CACHE_TAG}"
          tags_csv="${tag_bazel}"

          ./scripts/scope-boringcache-run.sh "$tag_bazel"

          echo "scope_started_at=${scope_started_at}" >> "$GITHUB_OUTPUT"
          echo "tag_bazel=${tag_bazel}" >> "$GITHUB_OUTPUT"
          echo "tags_csv=${tags_csv}" >> "$GITHUB_OUTPUT"

          cat > ./run-grpc-bazel-build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          bazel_output_root="${BAZEL_OUTPUT_USER_ROOT:?BAZEL_OUTPUT_USER_ROOT must be set}"
          bazel_output_base="${BAZEL_OUTPUT_BASE:?BAZEL_OUTPUT_BASE must be set}"
          max_attempts=3
          attempt=1
          while true; do
            if (cd upstream && ./tools/bazel --output_user_root="$bazel_output_root" --output_base="$bazel_output_base" build "$@" "$BAZEL_TARGET"); then
              break
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Bazel build failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            echo "Bazel build failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
            attempt=$((attempt + 1))
            sleep 5
          done
          SH
          chmod +x ./run-grpc-bazel-build.sh

      - name: Configure boringcache/one
        id: bazel_cache_release
        uses: boringcache/one@6b7033721b37075b2138fd0c769bf088e0836ce6 # v1.14.0
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: bazel
          trust-policy: publish
          force: ${{ inputs.cache_lane == 'rolling' }}
          fail-on-cache-error: ${{ inputs.cache_lane == 'fresh' }}
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Capture resolved BoringCache tag
        id: resolved_seed_tag
        run: |
          set -euo pipefail
          cache_tag="${{ steps.bazel_cache_release.outputs.cache-tag }}"
          [[ -n "$cache_tag" ]] || { echo "No resolved BoringCache remote cache tag" >&2; exit 1; }

          tags_csv="$cache_tag"
          echo "cache_tag=${cache_tag}" >> "$GITHUB_OUTPUT"
          echo "tags_csv=${tags_csv}" >> "$GITHUB_OUTPUT"

      - name: ${{ inputs.cache_lane == 'rolling' && 'Run rolling commit build' || 'Run fresh cold build' }}
        id: cold_baseline_build
        run: |
          set -euo pipefail
          if [[ "${{ inputs.cache_lane || 'fresh' }}" != "rolling" ]]; then
            rm -rf "$BAZEL_OUTPUT_USER_ROOT"
          fi

          phase_start="${{ steps.seed_timing_start.outputs.started_at }}"
          start="$(date +%s)"
          ./run-grpc-bazel-build.sh 2>&1 | tee /tmp/bazel-cold-build.log
          if [[ "${{ inputs.cache_lane || 'fresh' }}" != "rolling" ]] && \
             grep -Eq '[1-9][0-9,]* remote cache hit' /tmp/bazel-cold-build.log; then
            echo "Fresh BoringCache cold build unexpectedly restored Bazel action history" >&2
            exit 1
          fi
          end="$(date +%s)"
          echo "seconds=$((end - phase_start))" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Flush Bazel server state
        if: always()
        run: timeout 30s bash -lc 'cd upstream && ./tools/bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" --output_base="$BAZEL_OUTPUT_BASE" shutdown' || true

      - name: Collect BoringCache diagnostics
        if: always()
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          diagnostic_phase="${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}"
          ./scripts/collect-boringcache-diagnostics.sh \
            --output-dir "boringcache-diag-${diagnostic_phase}" \
            --workspace "$BENCHMARK_WORKSPACE" \
            --tags "${{ steps.resolved_seed_tag.outputs.tags_csv }}" \
            --phase "$diagnostic_phase" \
            --cache-tag "${{ steps.resolved_seed_tag.outputs.cache_tag }}" \
            --proxy-port "${{ steps.bazel_cache_release.outputs.proxy-port }}" \
            --proxy-log-path "${{ steps.bazel_cache_release.outputs.proxy-log-path }}" \
            --cache-root "$BAZEL_OUTPUT_USER_ROOT" \
            --cache-label "bazel-cache"

      - name: Upload BoringCache diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boringcache-diag-${{ env.BENCHMARK_ID }}-${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}-boringcache
          path: boringcache-diag-${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}
          if-no-files-found: warn

      - name: Capture BoringCache session summary
        if: always()
        run: |
          set -euo pipefail
          diagnostic_phase="${{ inputs.cache_lane == 'rolling' && 'rolling' || 'cold' }}"
          status_path="boringcache-diag-${diagnostic_phase}/proxy-status-${diagnostic_phase}.json"
          mkdir -p benchmark-session-summary
          if [[ -s "$status_path" ]]; then
            jq -c '.session_summary // empty' "$status_path" > benchmark-session-summary/benchmark-session-summary.json || true
          fi
          if [[ ! -s benchmark-session-summary/benchmark-session-summary.json ]]; then
            rm -f benchmark-session-summary/benchmark-session-summary.json
          fi

      - name: Upload BoringCache session summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-session-summary-${{ env.BENCHMARK_ID }}-boringcache-${{ inputs.cache_lane || 'fresh' }}
          path: benchmark-session-summary/benchmark-session-summary.json
          if-no-files-found: ignore


  scenario-builds:
    name: Warm
    needs: [prepare-benchmark, seed-cache]
    if: ${{ inputs.cache_lane != 'rolling' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAZEL_OUTPUT_USER_ROOT: /tmp/boringcache-bazel-root
      BAZEL_REMOTE_CACHE_TAG: ${{ needs.prepare-benchmark.outputs.bazel_remote_cache_tag }}
      BORINGCACHE_PROXY_METADATA_HINTS: benchmark=grpc-bazel,phase=warm
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned upstream submodule shallowly
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare scenario source tree
        run: ./scripts/prepare-source.sh warm1

      - name: Prepare benchmark helpers
        id: scope
        run: |
          set -euo pipefail

          scope_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tag_bazel="${BAZEL_REMOTE_CACHE_TAG}"
          tags_csv="${tag_bazel}"

          ./scripts/scope-boringcache-run.sh "$tag_bazel"

          echo "scope_started_at=${scope_started_at}" >> "$GITHUB_OUTPUT"
          echo "tag_bazel=${tag_bazel}" >> "$GITHUB_OUTPUT"
          echo "tags_csv=${tags_csv}" >> "$GITHUB_OUTPUT"

          cat > ./run-grpc-bazel-build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          bazel_output_root="${BAZEL_OUTPUT_USER_ROOT:?BAZEL_OUTPUT_USER_ROOT must be set}"
          bazel_output_base="${BAZEL_OUTPUT_BASE:?BAZEL_OUTPUT_BASE must be set}"
          max_attempts=3
          attempt=1
          while true; do
            if (cd upstream && ./tools/bazel --output_user_root="$bazel_output_root" --output_base="$bazel_output_base" build "$@" "$BAZEL_TARGET"); then
              break
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Bazel build failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            echo "Bazel build failed (attempt ${attempt}/${max_attempts}); retrying..." >&2
            attempt=$((attempt + 1))
            sleep 5
          done
          SH
          chmod +x ./run-grpc-bazel-build.sh

      - name: Reset Bazel local state before restore
        run: rm -rf "$BAZEL_OUTPUT_USER_ROOT"

      - name: Capture proxy setup start
        id: proxy_setup_timer_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure boringcache/one
        id: bazel_cache_release
        uses: boringcache/one@6b7033721b37075b2138fd0c769bf088e0836ce6 # v1.14.0
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: bazel
          trust-policy: restore
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Capture resolved BoringCache tag
        id: resolved_scenario_tag
        run: |
          set -euo pipefail
          cache_tag="${{ steps.bazel_cache_release.outputs.cache-tag }}"
          [[ -n "$cache_tag" ]] || { echo "No resolved BoringCache remote cache tag" >&2; exit 1; }

          tags_csv="$cache_tag"
          echo "cache_tag=${cache_tag}" >> "$GITHUB_OUTPUT"
          echo "tags_csv=${tags_csv}" >> "$GITHUB_OUTPUT"

      - name: Capture proxy ready timing
        id: proxy_ready_timing
        run: |
          set -euo pipefail
          start="${{ steps.proxy_setup_timer_start.outputs.started_at }}"
          end="$(date +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - name: Verify BoringCache remote cache configured
        run: |
          set -euo pipefail
          cache_tag="${{ steps.resolved_scenario_tag.outputs.cache_tag }}"
          if [[ -z "$cache_tag" ]]; then
            echo "BoringCache Bazel remote cache tag was not resolved" >&2
            exit 1
          fi
          if [[ -z "${BAZEL_REMOTE_CACHE_TAG:-}" ]]; then
            echo "BAZEL_REMOTE_CACHE_TAG is empty" >&2
            exit 1
          fi

      - name: Run warm build
        id: warm1_build
        run: |
          set -euo pipefail
          start="$(date +%s)"
          ./run-grpc-bazel-build.sh --profile=/tmp/bazel-warm-profile.gz 2>&1 | tee /tmp/bazel-warm-build.log
          if ! grep -Eq '[1-9][0-9,]* remote cache hit' /tmp/bazel-warm-build.log; then
            echo "Warm Bazel build produced zero native remote-cache hits" >&2
            exit 1
          fi
          end="$(date +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"


      - name: Flush Bazel server state
        if: always()
        run: timeout 30s bash -lc 'cd upstream && ./tools/bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" --output_base="$BAZEL_OUTPUT_BASE" shutdown' || true

      - name: Upload Bazel profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bazel-warm-profile
          path: /tmp/bazel-warm-profile.gz
          if-no-files-found: warn

      - name: Collect BoringCache diagnostics
        if: always()
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/collect-boringcache-diagnostics.sh \
            --output-dir "boringcache-diag-warm" \
            --workspace "$BENCHMARK_WORKSPACE" \
            --tags "${{ steps.resolved_scenario_tag.outputs.tags_csv }}" \
            --phase "warm" \
            --cache-tag "${{ steps.resolved_scenario_tag.outputs.cache_tag }}" \
            --proxy-port "${{ steps.bazel_cache_release.outputs.proxy-port }}" \
            --proxy-log-path "${{ steps.bazel_cache_release.outputs.proxy-log-path }}" \
            --cache-root "$BAZEL_OUTPUT_USER_ROOT" \
            --cache-label "bazel-cache"

      - name: Summarize Bazel miss profile
        if: always()
        run: |
          set -euo pipefail
          out_dir="boringcache-diag-warm"
          mkdir -p "$out_dir"
          if [[ -f /tmp/bazel-warm-build.log ]]; then
            cp /tmp/bazel-warm-build.log "${out_dir}/bazel-warm-build.log"
          fi
          if [[ -f /tmp/bazel-warm-profile.gz ]]; then
            cp /tmp/bazel-warm-profile.gz "${out_dir}/bazel-warm-profile.gz"
            python3 ./scripts/summarize-bazel-profile.py \
              --profile /tmp/bazel-warm-profile.gz \
              --build-log /tmp/bazel-warm-build.log \
              --output-dir "$out_dir" \
              --phase "warm"
          fi

      - name: Upload BoringCache diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boringcache-diag-${{ env.BENCHMARK_ID }}-warm-boringcache
          path: boringcache-diag-warm
          if-no-files-found: warn

      - name: Capture scenario timing
        id: phase_timing
        run: |
          set -euo pipefail
          build_seconds=""
          build_seconds="${{ steps.warm1_build.outputs.seconds }}"
          if [[ -z "${build_seconds}" ]]; then
            echo "No timing captured for warm" >&2
            exit 1
          fi
          restore_seconds=0
          proxy_ready_seconds="${{ steps.proxy_ready_timing.outputs.seconds }}"
          end_to_end_seconds=$((restore_seconds + proxy_ready_seconds + build_seconds))
          seconds="${end_to_end_seconds}"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          echo "restore_seconds=${restore_seconds}" >> "$GITHUB_OUTPUT"
          echo "proxy_ready_seconds=${proxy_ready_seconds}" >> "$GITHUB_OUTPUT"
          echo "build_seconds=${build_seconds}" >> "$GITHUB_OUTPUT"
          echo "end_to_end_seconds=${end_to_end_seconds}" >> "$GITHUB_OUTPUT"
      - name: Persist scenario timing artifact
        run: |
          set -euo pipefail
          mkdir -p benchmark-phase
          cat > "benchmark-phase/warm1.env" <<EOF
          phase=warm1
          seconds=${{ steps.phase_timing.outputs.seconds }}
          restore_seconds=${{ steps.phase_timing.outputs.restore_seconds }}
          proxy_ready_seconds=${{ steps.phase_timing.outputs.proxy_ready_seconds }}
          build_seconds=${{ steps.phase_timing.outputs.build_seconds }}
          end_to_end_seconds=${{ steps.phase_timing.outputs.end_to_end_seconds }}
          EOF
      - name: Upload scenario timing artifact
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-phase-${{ env.BENCHMARK_ID }}-boringcache-warm
          path: benchmark-phase/warm1.env
          if-no-files-found: error

  finalize-benchmark:
    name: Report
    needs: [prepare-benchmark, seed-cache, scenario-builds]
    if: ${{ always() && needs.prepare-benchmark.result == 'success' && needs.seed-cache.result == 'success' && (needs.scenario-builds.result == 'success' || needs.scenario-builds.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install BoringCache CLI
        run: >-
          ./scripts/install-boringcache-cli.sh
          "${{ inputs.cli_version }}"
          "linux-amd64"
      - name: Verify BoringCache CLI
        run: boringcache --version

      - name: Download scenario timing artifacts
        if: ${{ inputs.cache_lane != 'rolling' }}
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-phase-${{ env.BENCHMARK_ID }}-boringcache-*
          path: benchmark-phase
          merge-multiple: true

      - name: Download BoringCache session summary
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: benchmark-session-summary-${{ env.BENCHMARK_ID }}-boringcache-${{ inputs.cache_lane || 'fresh' }}
          path: benchmark-session-summary
      - name: Collect scenario timings
        if: ${{ inputs.cache_lane != 'rolling' }}
        id: timings
        run: |
          set -euo pipefail
          parse_phase() {
            local phase="$1"
            local key="${phase//-/_}"
            local file="benchmark-phase/${phase}.env"
            if [[ ! -f "$file" ]]; then
              echo "Missing timing artifact for phase ${phase}" >&2
              ls -R benchmark-phase || true
              exit 1
            fi
            local seconds
            seconds="$(grep "^seconds=" "$file" | head -n1 | cut -d= -f2-)"
            if [[ -z "${seconds}" ]]; then
              echo "Timing artifact for phase ${phase} has empty seconds" >&2
              cat "$file" >&2
              exit 1
            fi
            echo "${key}_seconds=${seconds}" >> "$GITHUB_OUTPUT"
            local build_seconds
            build_seconds="$(grep "^build_seconds=" "$file" | head -n1 | cut -d= -f2- || true)"
            if [[ -n "${build_seconds}" ]]; then
              echo "${key}_build_seconds=${build_seconds}" >> "$GITHUB_OUTPUT"
            fi
          }
          parse_phase warm1
      - name: Measure BoringCache storage usage
        id: cache_size
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_REQUIRE_SERVER_SIGNATURE: "0"
          BORINGCACHE_CHECK_STRICT: "1"
        run: |
          tags_csv="${{ needs.seed-cache.outputs.tags_csv }}"
          mkdir -p benchmark-storage
          breakdown_path="benchmark-storage/boringcache-storage-breakdown.json"
          bytes="$(BORINGCACHE_STORAGE_BREAKDOWN_PATH="$breakdown_path" ./scripts/sum-boringcache-check-sizes.sh "$BENCHMARK_WORKSPACE" "$tags_csv")"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          echo "breakdown_path=${breakdown_path}" >> "$GITHUB_OUTPUT"

      - name: Capture committed upstream ref
        id: upstream_ref
        run: echo "sha=$(git rev-parse HEAD:upstream)" >> "$GITHUB_OUTPUT"

      - name: Collect BoringCache action timing report
        id: action_timing_report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ./scripts/collect-boringcache-action-timings.py \
            --benchmark "$BENCHMARK_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --output-dir benchmark-results

      - name: Write benchmark artifacts
        id: artifact_files
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          cache_summary_args=()
          if [[ -s benchmark-session-summary/benchmark-session-summary.json ]]; then
            cache_summary_args=(--cache-session-summary-json benchmark-session-summary/benchmark-session-summary.json)
          fi

          ./scripts/write-benchmark-artifacts.sh \
            --benchmark "$BENCHMARK_ID" \
            --strategy "boringcache" \
            --lane "${{ inputs.cache_lane || 'fresh' }}" \
            --project-repo "$PROJECT_REPO" \
            --project-ref "${{ steps.upstream_ref.outputs.sha }}" \
            --cold-seconds "${{ needs.seed-cache.outputs.cold_seconds }}" \
            --cold-build-seconds "${{ needs.seed-cache.outputs.cold_build_seconds }}" \
            --warm1-seconds "${{ inputs.cache_lane == 'rolling' && '' || steps.timings.outputs.warm1_seconds }}" \
            --warm1-build-seconds "${{ inputs.cache_lane == 'rolling' && '' || steps.timings.outputs.warm1_build_seconds }}" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-storage-source "boringcache-check" \
            --storage-breakdown-json "${{ steps.cache_size.outputs.breakdown_path }}" \
            --action-timings-json "${{ steps.action_timing_report.outputs.json_path }}" \
            --hit-behavior-note "${{ inputs.cache_lane == 'rolling' && 'Rolling lane: this run builds the current upstream commit as-is with the prior rolling cache available, exports the updated cache, and records that commit build only; warm follow-up runs are intentionally skipped. BoringCache runs Bazel in remote-cache mode only: no Bazel output-root or disk-cache archive is restored or saved.' || 'Fresh lane: the cold build runs from empty local Bazel state with trust-policy=publish and a run-scoped Bazel remote-cache tag owned by the committed repo plan. Warm runs on a fresh runner with an empty Bazel output root, uses trust-policy=restore against that exact tag, and must report native Bazel remote-cache hits without restoring a local disk cache or output root.' }}" \
            "${cache_summary_args[@]}"

      - name: Write phase timing breakdown
        id: phase_breakdown
        run: |
          python3 ./scripts/write-phase-timing-breakdown.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy "boringcache" \
            --phase-dir benchmark-phase \
            --output-dir benchmark-results

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-boringcache-${{ inputs.cache_lane || 'fresh' }}
          path: |
            ${{ steps.artifact_files.outputs.json_path }}
            ${{ steps.artifact_files.outputs.md_path }}
            ${{ steps.phase_breakdown.outputs.json_path }}
            ${{ steps.phase_breakdown.outputs.md_path }}
            ${{ steps.action_timing_report.outputs.json_path }}
            ${{ steps.action_timing_report.outputs.md_path }}
          if-no-files-found: error

      - name: Publish summary
        run: |
          cat "${{ steps.artifact_files.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.action_timing_report.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.phase_breakdown.outputs.md_path }}" >> "$GITHUB_STEP_SUMMARY"
