name: "gRPC Bazel Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/grpc-bazel-benchmark.yml"
      - ".github/workflows/grpc-bazel-fresh-benchmark.yml"
      - ".github/workflows/grpc-bazel-actions-cache.yml"
      - ".github/workflows/grpc-bazel-boringcache.yml"
      - ".github/workflows/grpc-bazel-buildbuddy-cache.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/grpc-bazel-actions-cache.yml
    with:
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
    secrets: inherit

  buildbuddy-cache:
    name: BuildBuddy
    uses: ./.github/workflows/grpc-bazel-buildbuddy-cache.yml
    with:
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/grpc-bazel-boringcache.yml
    with:
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
    secrets: inherit
