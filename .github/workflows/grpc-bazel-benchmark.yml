name: "gRPC Bazel Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Optional exact BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".gitmodules"
      - ".github/workflows/grpc-bazel-benchmark.yml"
      - ".github/workflows/grpc-bazel-fresh-benchmark.yml"
      - ".github/workflows/reusable-grpc-bazel-benchmark.yml"
      - "README.md"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GHA
            strategy: actions-cache
          - name: BuildBuddy
            strategy: buildbuddy
          - name: BC
            strategy: boringcache
    uses: ./.github/workflows/reusable-grpc-bazel-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      benchmark_id: ${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit
