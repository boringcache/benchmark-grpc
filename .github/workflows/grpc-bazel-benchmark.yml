name: "gRPC Bazel Benchmark"
run-name: ${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary' || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      cli_version: {description: "Optional exact BoringCache CLI release tag.", required: false, type: string, default: ""}
      benchmark_id_suffix: {description: "Optional suffix for isolated comparison runs.", required: false, type: string, default: ""}
      runner_label: {description: "Optional runner label for a manual main-branch experiment.", required: false, type: string, default: ""}
  push:
    branches: [main]
    paths: [".gitmodules", "upstream"]
permissions: {contents: read, actions: write}
concurrency:
  group: grpc-bazel-rolling-${{ github.ref }}-${{ inputs.benchmark_id_suffix || 'default' }}
  cancel-in-progress: true
env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  BORINGCACHE_NO_GIT: "true"
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  BAZEL_OUTPUT_USER_ROOT: /tmp/boringcache-grpc-bazel/output-root
  BAZEL_OUTPUT_BASE: /tmp/boringcache-grpc-bazel/output-base
  BAZEL_DISK_CACHE: /tmp/boringcache-grpc-bazel/disk-cache
  BENCHMARK_ID: ${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}
jobs:
  commit:
    name: ${{ matrix.provider }} gRPC Bazel commit
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: GitHub Actions, strategy: actions-cache}
          - {provider: BuildBuddy, strategy: buildbuddy}
          - {provider: BoringCache, strategy: boringcache}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/grpc-bazel-benchmark
        with: {strategy: "${{ matrix.strategy }}", cache_lane: rolling, phase: publish, benchmark_id: "${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}", cli_version: "${{ inputs.cli_version }}"}
  report:
    name: gRPC Bazel rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download the benchmark phase evidence
        uses: actions/download-artifact@v6
        with:
          pattern: phase-${{ env.BENCHMARK_ID }}-*
          path: phase-evidence
      - name: Publish the gRPC Bazel benchmark report
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "gRPC Bazel rolling benchmark" \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - name: Retain the BoringCache rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-boringcache-rolling
          path: benchmark-results/${{ env.BENCHMARK_ID }}-boringcache-rolling.json
          if-no-files-found: error
      - name: Retain the GitHub Actions rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-actions-cache-rolling
          path: benchmark-results/${{ env.BENCHMARK_ID }}-actions-cache-rolling.json
          if-no-files-found: error
      - name: Retain the BuildBuddy rolling result
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-buildbuddy-rolling
          path: benchmark-results/${{ env.BENCHMARK_ID }}-buildbuddy-rolling.json
          if-no-files-found: error
